services:
  mariadb:
    image: mariadb:10.11
    container_name: zabbix-mariadb
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: zabbix
      MYSQL_USER: zabbix
      MYSQL_PASSWORD: zabbixpass
      MYSQL_ROOT_PASSWORD: rootpass
    volumes:
      - mariadb_data:/var/lib/mysql

  zabbix-server:
    build:
      context: ./zabbix-server-odbc
    container_name: zabbix-server
    restart: unless-stopped
    depends_on:
      - mariadb
    environment:
      DB_SERVER_HOST: mariadb
      MYSQL_DATABASE: zabbix
      MYSQL_USER: zabbix
      MYSQL_PASSWORD: zabbixpass
      # F14 - Scripts: habilita scripts globais (EnableGlobalScripts=1)
      ZBX_ENABLEGLOBALSCRIPTS: "1"

  zabbix-web:
    image: zabbix/zabbix-web-nginx-mysql:alpine-7.0-latest
    container_name: zabbix-web
    restart: unless-stopped
    depends_on:
      - mariadb
      - zabbix-server
    ports:
      - "8080:8080"
    environment:
      DB_SERVER_HOST: mariadb
      MYSQL_DATABASE: zabbix
      MYSQL_USER: zabbix
      MYSQL_PASSWORD: zabbixpass
      ZBX_SERVER_HOST: zabbix-server
      ZBX_DEFAULT_LANG: pt_BR
      PHP_TZ: America/Sao_Paulo

  zabbix-agent:
    image: zabbix/zabbix-agent:alpine-7.0-latest
    container_name: zabbix-agent
    restart: unless-stopped
    environment:
      ZBX_SERVER_HOST: zabbix-server
      ZBX_HOSTNAME: zabbix-agent
      # F14 - Scripts: permite comandos remotos (system.run) no agente
      ZBX_ALLOWKEY: "system.run[*]"

  # F16 - Monitoramento agentless: servidor SSH monitorado por verificacao simples
  ssh-server:
    image: lscr.io/linuxserver/openssh-server:latest
    container_name: ssh-server
    restart: unless-stopped
    environment:
      PUID: 1000
      PGID: 1000
      TZ: America/Sao_Paulo
      USER_NAME: labuser
      USER_PASSWORD: LabSSH123!
      PASSWORD_ACCESS: "true"
      SUDO_ACCESS: "false"

  cpu-load:
    build:
      context: ./cpu-load
    container_name: cpu-load
    restart: "no"
    profiles:
      - manual

volumes:
  mariadb_data:
